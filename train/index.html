<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#163E30">
<title>體能排課台｜奕晉</title>
<!--
  奕晉體能排課台 v0.1（2026-11-24 測試版）
  網球課表 → 排體能時段 → 這堂練什麼 → 練完回填 → 球員頁
  資料：本機測試走 /api（dev_server.py → 副本）；上線改走 Apps Script /exec（同一組 action）
-->
<style>
:root{
  --g:#163E30;--g2:#1f5a3f;--g3:#2d7553;--lime:#D8EF5F;--bg:#F3F6F1;--card:#fff;--ink:#13261e;--mut:#5b6e64;--line:#e2e9e2;--soft:#e9f2e7;
  --ok:#188052;--ok-bg:#e3f4e9;--warn:#a85d06;--warn-bg:#fff3dc;--bad:#c62828;--bad-bg:#fde7e4;--idle:#7b8a82;--idle-bg:#eef1ee;
  --shadow:0 1px 3px rgba(22,62,48,.08),0 4px 14px rgba(22,62,48,.04);
  --num:"SF Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.mut{color:var(--mut)}.sm{font-size:13px}.xs{font-size:12px}
[hidden]{display:none!important}

/* 頂部 */
.top{position:sticky;top:0;z-index:30;background:var(--g);color:#fff;padding:10px max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));padding-top:max(10px,env(safe-area-inset-top))}
.top-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;letter-spacing:.02em;flex:1;min-width:120px}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--lime);display:inline-block;box-shadow:0 0 0 3px rgba(216,239,95,.25)}
.test{font-size:11px;font-weight:700;background:var(--lime);color:var(--g);padding:2px 7px;border-radius:5px}
.datebar{display:flex;align-items:center;gap:2px;background:rgba(255,255,255,.1);border-radius:12px;padding:2px}
.datebar button{border:0;background:none;color:#fff;width:40px;height:40px;border-radius:10px;font-size:20px}
.datebar button:hover{background:rgba(255,255,255,.12)}
.datebar label{position:relative;padding:0 8px;font-weight:700;min-width:116px;text-align:center}
.datebar input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.me{font-size:13px;background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:999px;padding:7px 12px}

/* 分頁 */
.nav{position:sticky;top:60px;z-index:25;background:var(--card);border-bottom:1px solid var(--line)}
.nav-in{max-width:1120px;margin:0 auto;display:flex;padding:0 max(8px,env(safe-area-inset-right)) 0 max(8px,env(safe-area-inset-left))}
.nav button{flex:1;border:0;background:none;padding:12px 6px 10px;font-weight:700;color:var(--mut);border-bottom:3px solid transparent;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:14px}
.nav button small{font-size:11px;font-weight:500;opacity:.75}
.nav button[aria-selected=true]{color:var(--g);border-bottom-color:var(--g)}
@media (max-width:640px){
  .top-in{flex-wrap:nowrap;gap:8px}.brand{font-size:15px;min-width:0;flex:1;white-space:nowrap;overflow:hidden}.brand .bt{display:none}
  .datebar label{min-width:92px;padding:0 4px;font-size:15px}.datebar button{width:34px}.me{padding:7px 10px;max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .actbar-in{padding:8px 8px 8px 12px;gap:6px}.actbar-in .st{font-size:12px;min-width:100%}.actbar .btn{min-height:40px;padding:0 12px;font-size:14px;flex:1}
  .nav{position:fixed;top:auto;bottom:0;left:0;right:0;border-top:1px solid var(--line);border-bottom:0;padding-bottom:env(safe-area-inset-bottom)}
  .nav button{border-bottom:0;border-top:3px solid transparent;padding:9px 4px 8px}
  .nav button[aria-selected=true]{border-top-color:var(--g)}
}
main{max-width:1120px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right)) 140px max(16px,env(safe-area-inset-left))}

/* 共用元件 */
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.stack{display:grid;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
h2{font-size:18px;margin:0;line-height:1.3}
h3{font-size:15px;margin:0}
.eyebrow{font-size:12px;font-weight:700;color:var(--mut);letter-spacing:.06em}
.btn{border:0;border-radius:12px;min-height:44px;padding:0 16px;font-weight:700;background:var(--g);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{background:var(--g2)}
.btn.sec{background:var(--soft);color:var(--g)}
.btn.sec:hover{background:#dcebd8}
.btn.ghost{background:none;color:var(--g);border:1.5px solid #cfdacf}
.btn.lime{background:var(--lime);color:var(--g)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{border:0;background:none;color:var(--g);font-weight:700;padding:6px 4px;text-decoration:underline;text-underline-offset:3px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.idle{background:var(--idle-bg);color:var(--idle)}.pill.g{background:var(--g);color:#fff}.pill.lime{background:var(--lime);color:var(--g)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.ok{background:var(--ok)}.dot.warn{background:#e0a030}.dot.bad{background:var(--bad)}.dot.idle{background:#b8c3bd}
.empty{text-align:center;padding:28px 16px;color:var(--mut)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.note{background:var(--soft);border-radius:12px;padding:12px 14px;font-size:14px}
.note.warn{background:var(--warn-bg)}
select,input[type=text],input[type=time],textarea{border:1.5px solid #cfdacf;border-radius:10px;padding:9px 11px;background:#fff;min-height:44px}
textarea{width:100%;min-height:220px;font-family:var(--num);font-size:14px;line-height:1.6}

/* 網球繳交看板 */
.paste-card textarea{min-height:200px}
.avt{display:grid;gap:6px}
.avr{display:grid;grid-template-columns:minmax(100px,1.1fr) minmax(110px,1fr) minmax(0,2.2fr) auto;gap:6px 12px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--bg);border-left:4px solid var(--ok)}
.avr.warn{border-left-color:#e0a030}.avr.bad{border-left-color:var(--bad)}.avr.leave{border-left-color:#b8c3bd;opacity:.65}
.avr .nm,.avr .tn{display:grid;min-width:0}
.wins{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.win{display:inline-flex;flex-direction:column;padding:4px 9px;border-radius:9px;background:var(--card);border:1.5px solid var(--line);font-family:var(--num);font-size:13px;font-weight:700;line-height:1.25}
.win small{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;font-weight:500;font-size:11px;color:var(--mut)}
.win.full{border-color:#9bd08a}.win.half{border-color:#e9c27a;background:var(--warn-bg)}
.win.best{box-shadow:0 0 0 2px var(--g3) inset}
@media (max-width:640px){.avr{grid-template-columns:1fr auto}.avr .tn{grid-column:1/-1}.avr .wins{grid-column:1/-1}.avr .tg{grid-row:1;grid-column:2}}
.tsub{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.tc{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:7px 11px;border-radius:999px;background:var(--bg);font-size:13px;font-weight:700;white-space:nowrap}
.tc.miss{background:var(--bad-bg);color:var(--bad)}
.tc.late{background:var(--warn-bg);color:var(--warn)}
.tc.ok{background:var(--ok-bg);color:var(--ok)}

/* 摘要 */
.sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.sum div{background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.sum b{display:block;font-size:24px;font-family:var(--num);line-height:1.1}
.sum span{font-size:12px;color:var(--mut)}
@media (max-width:520px){.sum{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* 時段卡 */
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
@media (max-width:400px){.slots{grid-template-columns:1fr}}
.slot{background:var(--card);border-radius:16px;box-shadow:var(--shadow);display:grid;grid-template-columns:6px minmax(0,1fr);overflow:hidden}
.slot .bar{background:var(--ok)}
.slot.warn .bar{background:#e0a030}.slot.bad .bar{background:var(--bad)}
.slot-in{padding:14px 14px 12px;display:grid;gap:10px;min-width:0}
.slot-h{display:flex;align-items:flex-start;gap:10px}
.slot-t{font-family:var(--num);font-size:22px;font-weight:700;line-height:1}
.slot-t small{display:block;font-size:12px;color:var(--mut);font-weight:500;margin-top:4px}
.cap{margin-left:auto;text-align:right;display:grid;gap:4px;justify-items:end}
.meter{width:84px;height:6px;border-radius:3px;background:var(--bg);overflow:hidden}
.meter i{display:block;height:100%;background:var(--g3)}
.meter.full i{background:#e0a030}.meter.over i{background:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pc{border:1.5px solid transparent;background:var(--soft);border-radius:10px;padding:6px 10px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:5px;min-height:36px}
.pc:hover{border-color:var(--g3)}
.pc.warn{background:var(--warn-bg);color:var(--warn)}
.pc.bad{background:var(--bad-bg);color:var(--bad)}
.pc .tri{font-size:10px;color:var(--warn)}
.pc small{font-weight:500;font-size:11px;opacity:.8}
.coachbtn{border:1.5px dashed #b9c9bd;background:none;border-radius:10px;padding:5px 10px;font-size:13px;font-weight:700;color:var(--g)}
.flags{display:flex;flex-wrap:wrap;gap:6px}
.slot-f{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.manual{font-size:11px;font-weight:700;color:var(--g);background:var(--lime);padding:1px 6px;border-radius:4px}

/* 底部動作列 */
.actbar{position:sticky;bottom:12px;z-index:20;margin-top:16px}
@media (max-width:640px){.actbar{bottom:76px}}
.actbar-in{background:var(--g);color:#fff;border-radius:16px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;box-shadow:0 8px 24px rgba(22,62,48,.25)}
.actbar-in .st{flex:1;min-width:140px;font-size:13px}
.actbar-in .st b{display:block;font-size:14px}
.actbar .btn.sec{background:rgba(255,255,255,.12);color:#fff}
.actbar .btn.sec:hover{background:rgba(255,255,255,.2)}

/* 這堂練什麼 */
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.seg button{flex:0 0 auto;border:1.5px solid #cfdacf;background:#fff;border-radius:12px;padding:8px 12px;text-align:left;min-height:44px}
.seg button b{font-family:var(--num);display:block;font-size:15px}
.seg button span{font-size:12px;color:var(--mut)}
.seg button[aria-pressed=true]{border-color:var(--g);background:var(--g);color:#fff}
.seg button[aria-pressed=true] span{color:#cfe3d6}
.recent{display:flex;gap:6px;flex-wrap:wrap}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:820px){.opts{grid-template-columns:1fr}}
.opt{border:1.5px solid var(--line);border-radius:16px;background:var(--card);padding:14px;text-align:left;display:grid;gap:10px;align-content:start;box-shadow:var(--shadow)}
.opt:hover{border-color:var(--g3)}
.opt[aria-pressed=true]{border:2.5px solid var(--g);padding:13px;background:#f6fbf3}
.opt ol{margin:0;padding-left:20px;font-size:14px;display:grid;gap:3px}
.opt li.f{font-weight:700}
.opt li.f::after{content:" 弱項";font-size:11px;background:var(--lime);color:var(--g);padding:0 5px;border-radius:4px;margin-left:4px;font-weight:700}
.opt li.w{color:var(--mut)}
.lv{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:16px}
.lv.重{background:var(--bad-bg);color:var(--bad)}.lv.中{background:var(--ok-bg);color:var(--ok)}.lv.輕{background:var(--idle-bg);color:var(--idle)}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.person{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px;background:var(--card)}
.person h3{display:flex;align-items:center;gap:8px}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.kv div{background:var(--bg);border-radius:8px;padding:6px 8px;min-width:0}
.kv span{display:block;font-size:11px;color:var(--mut)}
.kv b{font-size:13px;overflow-wrap:anywhere}
.flag{font-size:11px;font-weight:800;padding:2px 7px;border-radius:5px;white-space:nowrap}
.flag.grow{background:var(--lime);color:var(--g)}.flag.bad{background:var(--bad-bg);color:var(--bad)}.flag.warn{background:var(--warn-bg);color:var(--warn)}.flag.idle{background:var(--idle-bg);color:var(--idle)}
.todo{font-size:14px;margin:0;padding-left:18px}

/* 回填 */
.fill{display:grid;gap:8px}
.frow{display:grid;grid-template-columns:minmax(80px,1fr) auto auto;gap:8px 12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--card)}
.frow .nm{font-weight:700}
.frow .nm small{display:block;font-weight:500;color:var(--mut);font-size:12px}
.tog{display:flex;border:1.5px solid #cfdacf;border-radius:10px;overflow:hidden}
.tog button{border:0;background:#fff;padding:0 10px;min-height:40px;font-size:13px;font-weight:700;color:var(--mut)}
.tog button[aria-pressed=true]{background:var(--g);color:#fff}
.tog button.abs[aria-pressed=true]{background:var(--bad)}
.step{display:flex;align-items:center;border:1.5px solid #cfdacf;border-radius:10px;overflow:hidden}
.step button{border:0;background:var(--soft);width:38px;min-height:40px;font-size:18px;font-weight:700;color:var(--g)}
.step output{min-width:40px;text-align:center;font-family:var(--num);font-weight:700}
.frow .more{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.frow .more input{flex:1;min-width:160px}
.frow.off{opacity:.6}
@media (max-width:560px){.frow{grid-template-columns:1fr auto}.frow .rpe{grid-column:1/-1;justify-self:start}}

/* 球員頁 */
.ph{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.av{width:54px;height:54px;border-radius:16px;background:var(--g);color:var(--lime);display:grid;place-items:center;font-weight:800;font-size:22px}
.goals{display:flex;flex-wrap:wrap;gap:6px}
.goals button{border:1.5px solid #cfdacf;background:#fff;border-radius:999px;padding:6px 14px;font-size:15px;min-height:40px;font-weight:600}
.goals button[aria-pressed="true"]{background:var(--ink,#1f3a2c);color:#fff;border-color:transparent}
.tip{border-left:4px solid var(--lime,#b9d84a);background:var(--bg);border-radius:8px;padding:8px 12px;font-size:14px}
.frow .q{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px}
.frow .q input{width:92px;min-height:40px}
.frow .q select{min-height:40px}
.nums{display:grid;gap:6px}
.nums div{display:grid;grid-template-columns:minmax(90px,1fr) auto;gap:8px;align-items:baseline;border-bottom:1px dashed var(--line);padding:4px 0}
.nums .up{color:var(--ok,#2e7d32);font-weight:700}.nums .dn{color:var(--bad,#c62828);font-weight:700}
.pgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:820px){.pgrid{grid-template-columns:1fr}}
.dim{display:grid;grid-template-columns:86px minmax(0,1fr) 70px;gap:8px;align-items:center;font-size:13px;margin-bottom:8px}
.trk{height:16px;background:var(--bg);border-radius:4px;position:relative;overflow:hidden}
.trk i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.trk i.a{background:#cfdacf}
.trk i.b{background:var(--g3);top:5px;bottom:5px}
.trk em{position:absolute;top:0;bottom:0;width:2px;background:var(--mut);left:50%;opacity:.35}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mut);margin:4px 0 10px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.legend .a::before{background:#cfdacf}.legend .b::before{background:var(--g3)}
.weeks{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;align-items:end;height:150px}
.wk{display:grid;justify-items:center;gap:3px;align-self:end}
.wk i{display:block;width:100%;background:var(--g3);border-radius:4px 4px 0 0;min-height:2px}
.wk i.hot{background:#e0a030}
.wk span{font-size:10px;color:var(--mut);font-family:var(--num)}
.mix{display:grid;gap:6px}
.insight{border-left:4px solid var(--lime);background:var(--bg);border-radius:0 12px 12px 0;padding:10px 14px;font-size:15px}
.hist{font-size:13px;display:grid;gap:4px;max-height:220px;overflow:auto}
.hist div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding:3px 0}

/* 網球教練 */
.tentry{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--card)}
.tentry .t{font-family:var(--num);font-weight:700}
.deadline{background:var(--g);color:#fff;border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:center}
.deadline b{color:var(--lime);font-size:20px;font-family:var(--num)}
.pick{display:flex;flex-wrap:wrap;gap:6px;max-height:240px;overflow:auto;padding:2px}
.pick button{border:1.5px solid #cfdacf;background:#fff;border-radius:999px;padding:6px 12px;font-size:14px;min-height:38px}
.pick button[aria-pressed=true]{background:var(--g);border-color:var(--g);color:#fff}

/* 底部抽屜 */
.sheet-bg{position:fixed;inset:0;background:rgba(10,25,18,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:min(560px,100%);max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:8px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.2)}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:20px}}
.grab{width:40px;height:5px;border-radius:3px;background:#d5ddd7;margin:4px auto 12px}
.sheet h2{margin-bottom:4px}
.opt-list{display:grid;gap:8px;margin-top:12px}
.opt-list button{display:flex;align-items:center;gap:10px;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px;min-height:52px}
.opt-list button:hover{border-color:var(--g3)}
.opt-list button b.num{font-family:var(--num)}
.opt-list button span{margin-left:auto}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.loading{display:grid;place-items:center;padding:60px 0;color:var(--mut)}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--g);border-radius:50%;animation:sp 1s linear infinite;margin-bottom:10px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.gate{max-width:420px;margin:40px auto}
.gate .opt-list button{min-height:48px}
details summary{cursor:pointer;font-weight:700;color:var(--g)}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><i></i>體能<span class="bt">排課台</span> <span class="test" id="testTag" hidden>測試</span></div>
  <div class="datebar" id="datebar" hidden>
    <button id="prevD" aria-label="前一天">‹</button>
    <label><span id="dLabel"></span><input type="date" id="dInput" aria-label="選日期"></label>
    <button id="nextD" aria-label="後一天">›</button>
  </div>
  <button class="me" id="meBtn" hidden></button>
</div></header>
<nav class="nav" id="nav" hidden><div class="nav-in" role="tablist">
  <button role="tab" data-v="plan" aria-selected="true">排課<small>時段</small></button>
  <button role="tab" data-v="sess" aria-selected="false">這堂<small>練什麼</small></button>
  <button role="tab" data-v="fill" aria-selected="false">回填<small>RPE</small></button>
  <button role="tab" data-v="player" aria-selected="false">球員<small>進步</small></button>
</div></nav>
<main id="app"><div class="loading"><div class="spin"></div>載入中…</div></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="sheetRoot"></div>

<script src="engine.js"></script>
<script>
'use strict';
const E = window.TrainEngine;
const IS_DEV = /^(127\.0\.0\.1|localhost)$/.test(location.hostname);
// 測試期：接「張無忌」副本的測試後台；正式上線改成 PROD_API
const TEST_API = 'https://script.google.com/macros/s/AKfycbx7txO6BrZjh-EMSXpVWO00OVuQCBor8XOeSN7dt2KCMMLIT4uBnNwRxACHcgIvCZt1/exec';
const PROD_API = 'https://script.google.com/macros/s/AKfycbzui0D7wBTHs02oqO87bbabZdvdvEW0FuHtmxMWfQAot30pm5C62AkjBvQSxltp8ldE/exec';
const USE_TEST = false;
const API = IS_DEV ? '/api' : (USE_TEST ? TEST_API : PROD_API);
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const LS = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }, del(k) { try { localStorage.removeItem(k); } catch (e) {} } };

const st = {
  me: null, date: '', day: null, view: 'plan',
  slots: [], dirty: false, planStatus: '', planAt: '',
  curSlot: null, fill: {}, curPlayer: null, sugg: {}
};

function toast(m, ms) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), ms || 2400); }
async function api(action, params) {
  const tk = (st.me && st.me.token) || '';
  const body = JSON.stringify(Object.assign({ action, token: tk }, params || {}));
  const r = (!IS_DEV && action === 'login')
    ? await fetch(API + '?' + new URLSearchParams({ action: 'login', user: params.user, pass: params.pass || '' }))
    : await fetch(API, IS_DEV ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body } : { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body });
  const d = await r.json();
  if (d.needLogin) { logout(); throw new Error('needLogin'); }
  if (d.error) throw new Error(d.error);
  return d;
}

// ───────────── 日期 ─────────────
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
function dLabel(d) { return (+d.slice(5, 7)) + '/' + (+d.slice(8)) + '（' + E.weekday(d) + '）'; }
function setDate(d) { st.date = d; $('#dLabel').textContent = dLabel(d); $('#dInput').value = d; load(); }
$('#prevD').onclick = () => guardDirty(() => setDate(E.addDays(st.date, -1)));
$('#nextD').onclick = () => guardDirty(() => setDate(E.addDays(st.date, 1)));
$('#dInput').onchange = e => e.target.value && guardDirty(() => setDate(e.target.value));

// ───────────── 抽屜 ─────────────
function sheet(html, onMount) {
  const root = $('#sheetRoot');
  root.innerHTML = `<div class="sheet-bg" id="sbg"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`;
  $('#sbg').addEventListener('click', e => { if (e.target.id === 'sbg') closeSheet(); });
  document.addEventListener('keydown', escClose);
  onMount && onMount(root);
  const f = root.querySelector('button,input,select,textarea'); f && f.focus();
}
function escClose(e) { if (e.key === 'Escape') closeSheet(); }
function closeSheet() { $('#sheetRoot').innerHTML = ''; document.removeEventListener('keydown', escClose); }
function confirmSheet(title, msg, okText, fn) {
  sheet(`<h2>${esc(title)}</h2><p class="mut">${esc(msg)}</p><div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn ghost" id="cNo">取消</button><button class="btn" id="cYes">${esc(okText)}</button></div>`, () => {
    $('#cNo').onclick = closeSheet; $('#cYes').onclick = () => { closeSheet(); fn(); };
  });
}
function guardDirty(fn) { if (st.dirty) confirmSheet('排課還沒存', '換日期會丟掉剛剛的調整。', '不存，直接換', fn); else fn(); }

// ───────────── 登入 ─────────────
function logout() { LS.del('yj_train_me'); st.me = null; gate(); }
async function gate() {
  $('#nav').hidden = true; $('#datebar').hidden = true; $('#meBtn').hidden = true;
  if (IS_DEV) {
    $('#testTag').hidden = false;
    $('#app').innerHTML = `<div class="gate card"><h2>測試模式登入</h2><p class="mut sm">資料讀寫的是「張無忌」副本，正式表不會動。點一位教練看他的畫面。</p><div class="loading" id="cl"><div class="spin"></div></div></div>`;
    try {
      const r = await fetch('/api', { method: 'POST', body: JSON.stringify({ action: 'getDay', token: 'dev:x', date: today() }) }).then(r => r.json());
      const cs = r.coaches || [];
      const by = t => cs.filter(c => c.type === t);
      $('#cl').outerHTML = `<p class="eyebrow" style="margin-top:14px">體能教練</p><div class="opt-list">${by('體能').map(c => `<button data-u="${esc(c.name)}"><b>${esc(c.name)}</b><span class="pill ${c.group === '大隊' ? 'g' : 'lime'}">${esc(c.group)}</span></button>`).join('')}</div>
        <p class="eyebrow" style="margin-top:18px">網球教練（只看得到交課表）</p><div class="opt-list" style="grid-template-columns:repeat(3,1fr)">${by('網球').map(c => `<button data-u="${esc(c.name)}" style="justify-content:center"><b>${esc(c.name)}</b></button>`).join('')}</div>`;
      document.querySelectorAll('[data-u]').forEach(b => b.onclick = () => doLogin(b.dataset.u));
    } catch (e) { $('#app').innerHTML = `<div class="card empty"><b>連不到測試伺服器</b>請先在終端機跑 python3 dev_server.py</div>`; }
  } else {
    $('#testTag').hidden = !USE_TEST;
    $('#app').innerHTML = `<form class="gate card stack" id="lf"><h2>教練登入</h2>${USE_TEST ? '<p class="note sm" style="margin:0">測試版：排課、回填存在測試用的試算表；只有「對不到 01 的名字」補登會寫進正式 01 球員總表。帳號用測試表的教練帳號。</p>' : ''}<input type="text" id="lu" placeholder="帳號" autocomplete="username" required><input type="password" id="lp" placeholder="密碼" autocomplete="current-password" required style="border:1.5px solid #cfdacf;border-radius:10px;padding:9px 11px;min-height:44px"><button class="btn">登入</button></form>`;
    $('#lf').onsubmit = e => { e.preventDefault(); doLogin($('#lu').value.trim(), $('#lp').value); };
  }
}
async function doLogin(user, pass) {
  try {
    let r = await api('login', { user, pass });
    if (!IS_DEV) { st.me = { token: r.token, name: r.name }; const me = await api('trainMe', {}); r = Object.assign(me, { token: r.token }); }
    st.me = r; LS.set('yj_train_me', JSON.stringify(r)); start();
  }
  catch (e) { toast(e.message); }
}
function start() {
  $('#datebar').hidden = false; $('#meBtn').hidden = false;
  $('#meBtn').textContent = (st.me.previewAs ? '預覽 ' + st.me.previewAs : st.me.name + (st.me.type === '網球' ? '（網球）' : '')) + ' ▾';
  $('#meBtn').onclick = () => {
    const real = st.me.realType || st.me.type;
    const prev = (USE_TEST || IS_DEV) && real === '體能' && st.day ? `<p class="eyebrow" style="margin-top:14px">測試：用網球教練的身分預覽</p><div class="pick">${st.me.previewAs ? '<button id="pvOff" aria-pressed="true">回到體能教練</button>' : ''}${(st.day.coaches || []).filter(c => c.type === '網球').map(c => `<button data-pv="${esc(c.code || c.name)}">${esc(c.name)}</button>`).join('')}</div>` : '';
    sheet(`<h2>${esc(st.me.name)}</h2><p class="mut">${esc(st.me.previewAs ? '預覽：網球教練 ' + st.me.previewAs : st.me.type + '教練' + (st.me.group ? '・' + st.me.group : ''))}</p>${prev}<div class="opt-list"><button id="lo">登出／換人</button></div>`, () => {
      $('#lo').onclick = () => { closeSheet(); logout(); };
      document.querySelectorAll('[data-pv]').forEach(b => b.onclick = () => { closeSheet(); st.me.realType = real; st.me.previewAs = b.dataset.pv; st.me.type = '網球'; st.me.code = b.dataset.pv; st.tdraft = null; start(); });
      const off = $('#pvOff'); if (off) off.onclick = () => { closeSheet(); st.me.type = real; delete st.me.previewAs; st.me.code = ''; start(); };
    });
  };
  $('#nav').hidden = st.me.type === '網球';
  // 網球教練預設看「明天」（要交的那天）
  setDate(E.addDays(today(), 1));
}
document.querySelectorAll('.nav button').forEach(b => b.onclick = () => go(b.dataset.v));
function go(v) {
  st.view = v;
  document.querySelectorAll('.nav button').forEach(b => b.setAttribute('aria-selected', b.dataset.v === v));
  render(); window.scrollTo({ top: 0 });
}

// ───────────── 載入一天 ─────────────
let loadSeq = 0;
async function load() {
  const seq = ++loadSeq;
  $('#app').innerHTML = `<div class="loading"><div class="spin"></div>讀取 ${dLabel(st.date)} 的資料…</div>`;
  try {
    const d = await api('getDay', { date: st.date });
    if (seq !== loadSeq) return;
    prep(d);
    st.day = d; st.dirty = false; st.sugg = {};
    if (d.plan && d.plan.slots.length) { st.slots = d.plan.slots; st.planStatus = d.plan.status; st.planAt = d.plan.at; st.showPlan = true; E.recheck(st.slots, engineInput()); }
    else { st.slots = autoPlan(); st.planStatus = ''; st.planAt = ''; st.showPlan = false; }
    if (!st.slots.find(s => s.id === st.curSlot)) st.curSlot = (st.slots[0] || {}).id || null;
    if (!st.curPlayer || !d.roster.find(p => p.name === st.curPlayer)) st.curPlayer = (st.slots[0] && st.slots[0].players[0]) || (d.roster[0] || {}).name;
    render();
  } catch (e) { if (e.message !== 'needLogin') $('#app').innerHTML = `<div class="card empty"><b>讀不到資料</b>${esc(e.message)}<br><button class="btn" style="margin-top:12px" onclick="load()">再試一次</button></div>`; }
}
function prep(d) {
  const idx = E.nameIndex(d.roster);
  d.idx = idx;
  d.resolve = n => idx[E.nameKey(n)] || n;
  // 舊資料裡可能混進教練稱呼（赖＝賴）或「女」「男」這種切剩的字 → 不當成學員
  const coachKeys = new Set((d.coaches || []).map(c => E.nameKey(c.code || c.name)).filter(Boolean));
  d.tennis.forEach(t => t.players = t.players.map(d.resolve).filter(n => !coachKeys.has(E.nameKey(n)) && !/^[女男]$/.test(n)));
  d.tests = d.tests || {};
  d.latest = {};
  Object.keys(d.radar).forEach(n => { const h = d.radar[n]; d.latest[n] = h[h.length - 1]; });
  // 程度沒填 → 用檢測總分暫估
  d.roster.forEach(p => {
    p.levelGuess = false;
    if (!p.level && d.latest[p.name] && d.latest[p.name].total != null) {
      const t = d.latest[p.name].total; p.level = t >= 60 ? '高' : t >= 45 ? '中' : '低'; p.levelGuess = true;
    }
  });
}
function engineInput() {
  const d = st.day;
  return { date: st.date, roster: d.roster, tennis: d.tennis, leave: d.leave, coaches: d.coaches };
}
function autoPlan(keepManual) {
  const inp = engineInput();
  inp.locked = keepManual ? st.slots.filter(s => s.manual) : [];
  const r = E.schedule(inp);
  st.unplaced = r.unplaced;
  const out = r.slots.map((s, i) => Object.assign(s, { id: s.id || ('S' + (i + 1)) }));
  E.recheck(out, inp);
  return out;
}
function markDirty() { st.dirty = true; E.recheck(st.slots, engineInput()); render(); }

// ───────────── render ─────────────
function render() {
  if (!st.day) return;
  if (st.me.type === '網球') return renderTennisCoach();
  ({ plan: renderPlan, sess: renderSess, fill: renderFill, player: renderPlayer })[st.view]();
}

/* ==== 1. 排課 ==== */
function submissions() {
  const d = st.day, codes = d.coaches.filter(c => c.type === '網球');
  const deadline = E.addDays(st.date, -1) + ' 20:00';
  return codes.map(c => {
    const mine = d.tennis.filter(t => String(t.coach).split('、').some(x => x === c.name || x === c.code));
    if (!mine.length) return { c, st: 'miss', txt: '未交' };
    const at = mine.map(t => t.at).sort().pop() || '';
    const late = at && at > deadline;
    return { c, st: late ? 'late' : 'ok', txt: (late ? '遲交 ' : '') + (at ? at.slice(5).replace('-', '/') : '已交'), n: mine.length };
  });
}
function relDay(d) { const t = today(); return d === t ? '今天' : d === E.addDays(t, 1) ? '明天' : d === E.addDays(t, -1) ? '昨天' : dLabel(d); }
// ───────────── 對不到 01 的名字：一鍵補登（直接寫正式 01 球員總表） ─────────────
const IGN_KEY = 'yj_train_ignore';
function ignored() { try { return new Set(JSON.parse(LS.get(IGN_KEY) || '[]')); } catch (e) { return new Set(); } }
function setIgnored(set) { LS.set(IGN_KEY, JSON.stringify([...set])); }
function nfBlock(notIn) {
  if (!notIn.length) return '';
  const ign = ignored(), todo = notIn.filter(n => !ign.has(n)), skipped = notIn.length - todo.length;
  const reset = skipped ? `<span class="xs mut">已略過 ${skipped} 位只上網球的・<a href="#" id="nfReset">重新顯示</a></span>` : '';
  if (!todo.length) return `<p class="xs mut" style="margin:0">${reset}</p>`;
  return `<div class="note stack" style="gap:8px">
      <div class="sm"><b>對不到 01 的名字（${todo.length}）</b>　點名字補一次，之後網球表這樣寫都會自動對到。</div>
      <div class="pick" id="nfP" style="max-height:none">${todo.map(n => `<button data-nf="${esc(n)}">${esc(n)}</button>`).join('')}</div>
      ${reset}
    </div>`;
}
function bindNf() {
  document.querySelectorAll('[data-nf]').forEach(b => b.onclick = () => linkSheet(b.dataset.nf));
  const r = $('#nfReset'); if (r) r.onclick = e => { e.preventDefault(); setIgnored(new Set()); render(); };
}
function afterRosterChange() {
  prep(st.day);
  if (!st.showPlan) st.slots = autoPlan();
  else E.recheck(st.slots, engineInput());
  render();
}
function linkSheet(raw) {
  const roster = st.day.roster, k = E.nameKey(raw);
  const score = p => { const a = E.nameKey(p.name + (p.alias || '')); let n = 0; new Set(k).forEach(c => { if (a.includes(c)) n++; }); return n; };
  const sugg = roster.map(p => ({ p, s: score(p) })).filter(x => x.s > 0).sort((a, b) => b.s - a.s).slice(0, 8).map(x => x.p);
  const looksName = /^[\u3400-\u9fff]{3,4}$/.test(raw) && !/[女男]$/.test(raw);
  let grp = '';
  sheet(`<h2>「${esc(raw)}」是誰？</h2>
    <p class="mut sm" style="margin:4px 0 0">補一次就好，之後網球表寫「${esc(raw)}」都會自動對到。</p>
    <h3 style="font-size:15px;margin:16px 0 6px">是 01 裡的這位</h3>
    <input type="text" id="lkQ" placeholder="搜尋 01 的姓名或暱稱" style="width:100%" autocomplete="off">
    <div class="pick" id="lkP" style="margin-top:8px"></div>
    <h3 style="font-size:15px;margin:18px 0 6px">01 沒有這個人 → 新增</h3>
    <div class="row" style="gap:8px;flex-wrap:wrap;align-items:center">
      <input type="text" id="lkN" value="${looksName ? esc(E.toTrad(raw)) : ''}" placeholder="全名（繁體）" style="flex:1;min-width:150px">
      <div class="pick" id="lkG" style="flex:none"><button data-g="大隊">大隊</button><button data-g="小朋友">小朋友</button></div>
    </div>
    <div class="row" style="justify-content:space-between;margin-top:16px;gap:8px;flex-wrap:wrap">
      <button class="btn ghost" id="lkIgn">只上網球，不用管</button>
      <button class="btn" id="lkAdd" disabled>新增到 01</button>
    </div>
    <p class="xs mut" style="margin:10px 0 0">會直接寫進正式的 01 球員總表。新增的人，生日、性別之後要到 01 補上（檢測報告需要）。</p>`, () => {
    const draw = () => {
      const q = E.nameKey($('#lkQ').value);
      const list = q ? roster.filter(p => E.nameKey(p.name + ' ' + (p.alias || '')).includes(q)).slice(0, 12) : sugg;
      $('#lkP').innerHTML = list.length ? list.map(p => `<button data-pick="${esc(p.name)}">${esc(p.name)}${p.alias ? ` <small class="mut">${esc(p.alias)}</small>` : ''}</button>`).join('') : `<span class="sm mut">${q ? '01 找不到，看看是不是要新增' : '打字搜尋 01 的名字'}</span>`;
      document.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => doLink('alias', b.dataset.pick));
    };
    const okAdd = () => { $('#lkAdd').disabled = !($('#lkN').value.trim() && grp); };
    $('#lkQ').oninput = draw; draw();
    $('#lkN').oninput = okAdd;
    document.querySelectorAll('#lkG [data-g]').forEach(b => b.onclick = () => { grp = b.dataset.g; document.querySelectorAll('#lkG [data-g]').forEach(x => x.setAttribute('aria-pressed', x === b)); okAdd(); });
    $('#lkIgn').onclick = () => { const s = ignored(); s.add(raw); setIgnored(s); closeSheet(); render(); };
    $('#lkAdd').onclick = () => doLink('add', E.toTrad($('#lkN').value.trim()), grp);
  });
  async function doLink(mode, name, group) {
    const btns = document.querySelectorAll('#sheetRoot button'); btns.forEach(b => b.disabled = true);
    try {
      const r = await api('rosterLink', { mode, name, alias: raw, group });
      closeSheet();
      if (mode === 'alias') {
        const p = roster.find(x => x.name === name); if (p) p.alias = r.alias || ((p.alias ? p.alias + '、' : '') + raw);
        toast(`已登記：${raw} ＝ ${name}`);
      } else {
        roster.push({ id: String(r.id), name, alias: name === raw ? '' : raw, group, unclassified: false, team: '', level: '', growth: false, earliest: '', latest: '', status: '在訓', coach: '' });
        toast(`已新增到 01：${name}（#${r.id}）`);
      }
      afterRosterChange();
    } catch (e) {
      if (e.message === 'needLogin') return;
      btns.forEach(b => b.disabled = false);
      toast('沒存到：' + e.message, 4000);
    }
  }
}

function renderPlan() {
  const d = st.day, subs = submissions();
  const A = E.availability({ roster: d.roster, tennis: d.tennis, leave: d.leave });
  const cnt = k => A.people.filter(p => p.status === k).length;
  const placed = [].concat(...st.slots.map(s => s.players));
  const nWarn = st.slots.filter(s => s.status === 'warn').length, nBad = st.slots.filter(s => s.status === 'bad').length;
  const missing = subs.filter(s => s.st === 'miss');
  const stateTxt = st.dirty ? '有調整還沒存' : st.planStatus === '定案' ? '已定案・' + (st.planAt || '').slice(5) : st.planStatus === '草案' ? '草案已存・' + (st.planAt || '').slice(5) : '系統草案（還沒存）';
  const unplaced = (st.unplaced || []).filter(u => !placed.includes(u.name));
  const rel = relDay(st.date);
  const unc = A.people.filter(p => p.unclassified).length;

  const pasteCard = `<section class="card stack paste-card">
      <div><p class="eyebrow" style="margin:0">步驟 1</p><h2>貼上${esc(rel)}的網球課表</h2></div>
      <textarea id="inlineT" placeholder="把網球教練的備忘錄整段貼進來，例如：&#10;9-10 王圣盈  賴&#10;8-10 刘珈妮莫可妍 鄭&#10;1-3 李一凡女 杨杺颖 小白 宥"></textarea>
      <div id="inlinePrev" class="sm mut">下午的 1–7 點會自動當成 13–19 點。名字黏在一起、後面接教練都讀得懂。</div>
      <div class="row" style="justify-content:flex-end"><button class="btn" id="inlineGo" disabled>分析${esc(rel)}誰能練 →</button></div>
    </section>`;

  const tennisCard = `<section class="card stack" aria-labelledby="h-ten">

function previewParse(text, el) {
  const codes = st.day.coaches.filter(c => c.type === '網球').map(c => c.code || c.name);
  const parsed = E.parseTennisText(text, { roster: st.day.roster, coachCodes: codes });
  const rs = new Set(st.day.roster.map(p => p.name));
  const ppl = new Set([].concat(...parsed.entries.map(e => e.players)));
  const inR = [...ppl].filter(n => rs.has(n));
  el.innerHTML = parsed.entries.length ? `讀到 <b>${parsed.entries.length}</b> 堂網球、<b>${ppl.size}</b> 位球員，其中 <b>${inR.length}</b> 位是體能學員。` +
    (parsed.bad.length ? `<div class="note warn" style="margin-top:6px">這幾行看不懂，會略過：<br>${parsed.bad.map(esc).join('<br>')}</div>` : '') : (text.trim() ? '還沒讀到時間，格式像「1-3 名字 教練」。' : '');
  return parsed;
}

function slotCard(s) {
  const g = E.CFG.groups[s.group] || { cap: 8 };
  const pct = Math.min(100, Math.round(s.players.length / g.cap * 100));
  const why = s.why || {};
  const chips = s.players.map(n => {
    const cls = s.clash && s.clash[n] ? 'bad' : s.partial && s.partial[n] ? 'warn' : '';
    const p = st.day.roster.find(x => x.name === n) || {};
    const tip = (s.clash && s.clash[n]) || (s.partial && s.partial[n] ? '只能上 ' + s.partial[n] + ' 分鐘' : '') || why[n] || '';
    return `<button class="pc ${cls}" data-s="${s.id}" data-p="${esc(n)}" title="${esc(tip)}">${p.growth ? '<span class="tri">▲</span>' : ''}${esc(n)}${s.partial && s.partial[n] ? `<small>${s.partial[n]}分</small>` : ''}</button>`;
  }).join('');
  const opt = s.option ? `<span class="pill g">${esc(s.option)}</span>` : '';
  return `<article class="slot ${s.status}"><div class="bar"></div><div class="slot-in">
    <div class="slot-h">
      <div class="slot-t">${esc(s.start)}<small>到 ${esc(s.end)}・${esc(s.group)}${s.team ? '・' + esc(s.team) : ''}</small></div>
      ${s.manual ? '<span class="manual">手動</span>' : ''}
      <div class="cap"><span class="num sm"><b>${s.players.length}</b> / ${g.cap} 人</span><div class="meter ${s.players.length > g.cap ? 'over' : s.players.length === g.cap ? 'full' : ''}"><i style="width:${pct}%"></i></div></div>
    </div>
    <div class="chips">${chips || '<span class="sm mut">還沒有人</span>'}</div>
    ${s.flags && s.flags.length ? `<div class="flags">${s.flags.map(f => `<span class="pill ${/撞|超過/.test(f) ? 'bad' : 'warn'}">${esc(f)}</span>`).join('')}</div>` : ''}
    <div class="slot-f">
      <button class="coachbtn" data-coach="${s.id}">${s.coaches && s.coaches.length ? '教練：' + s.coaches.map(esc).join('＋') : '＋ 派教練'}</button>
      <div class="row" style="gap:4px">${opt}${s.manual ? `<button class="link sm" data-del="${s.id}">刪掉</button>` : ''}<button class="link" data-go="${s.id}">練什麼 →</button></div>
    </div>
  </div></article>`;
}
function playerSheet(sid, name) {
  const from = st.slots.find(s => s.id === sid);
  const others = st.slots.filter(s => s.id !== sid && s.group === from.group);
  const preview = to => { const c = JSON.parse(JSON.stringify(st.slots)); const f = c.find(s => s.id === sid), t = c.find(s => s.id === to.id); f.players = f.players.filter(n => n !== name); t.players.push(name); E.recheck(c, engineInput()); const tt = c.find(s => s.id === to.id); return tt.clash[name] ? ['bad', '撞到網球'] : tt.partial[name] ? ['warn', '只能 ' + tt.partial[name] + ' 分'] : tt.players.length > (E.CFG.groups[tt.group] || {}).cap ? ['bad', '超過人數'] : ['ok', '可以']; };
  const why = (from.why || {})[name] || '';
  const tn = st.day.tennis.filter(t => t.players.includes(name)).map(t => t.start + '–' + t.end).join('、');
  sheet(`<h2>${esc(name)}</h2><p class="mut sm" style="margin:0">網球：${esc(tn || '—')}${why ? '<br>排在這裡：' + esc(why) : ''}</p>
    <p class="eyebrow" style="margin-top:14px">移到別堂</p>
    <div class="opt-list">${others.length ? others.map(o => { const [c, t] = preview(o); return `<button data-to="${o.id}"><b>${esc(o.start)}</b> ${esc(o.group)}・${o.players.length} 人<span class="pill ${c}">${esc(t)}</span></button>`; }).join('') : '<p class="sm mut">同組沒有其他堂。可以用「＋ 加一堂」開新的。</p>'}</div>
    <div class="opt-list"><button id="toLeave">今天請假（從排課移除）</button><button id="toPlayer">看 ${esc(name)} 的球員頁</button></div>`, () => {
    document.querySelectorAll('[data-to]').forEach(b => b.onclick = () => {
      from.players = from.players.filter(n => n !== name); st.slots.find(s => s.id === b.dataset.to).players.push(name);
      closeSheet(); markDirty(); toast(name + ' 移到 ' + st.slots.find(s => s.id === b.dataset.to).start);
    });

    $('#toPlayer').onclick = () => { closeSheet(); st.curPlayer = name; go('player'); };

}

function addSlotSheet() {

    $('#aNo').onclick = closeSheet;

      st.slots = st.slots.filter(s => s.players.length || s.manual);

    };
  });

  st.tdraft = { date: st.date, entries: local };
  $('#app').innerHTML = `<div class="stack" style="max-width:640px;margin:0 auto">
    <div class="deadline"><div style="flex:1"><div class="sm" style="opacity:.8">${dLabel(st.date)} 的網球課表</div><div>請在 <b>${dLabel(E.addDays(st.date, -1))} 20:00</b> 前送出</div></div>${at ? `<span class="pill ${at > deadline ? 'warn' : 'ok'}">${at > deadline ? '遲交' : '已送出'} ${esc(at.slice(5))}</span>` : '<span class="pill bad">還沒送</span>'}</div>
    <section class="stack">
      <div class="row between"><h2>我的課（${local.length}）</h2><button class="link" id="copyLast">沿用上週${E.weekday(st.date)}</button></div>
      ${local.length ? local.map((e, i) => `<div class="tentry"><span class="t">${esc(e.start)}<br><span class="mut xs">${esc(e.end)}</span></span><div class="chips">${e.players.map(p => `<span class="pc">${esc(p)}</span>`).join('')}</div><div class="row" style="gap:2px"><button class="link sm" data-ed="${i}">改</button><button class="link sm" data-rm="${i}" style="color:var(--bad)">刪</button></div></div>`).join('')
        : `<div class="card empty"><b>還沒有課</b>按下面「＋ 加一堂網球課」，或沿用上週同一天。</div>`}
      <button class="btn ghost" id="addT">＋ 加一堂網球課</button>
    </section>
    <div class="actbar"><div class="actbar-in"><div class="st"><b>${local.length} 堂</b>送出後體能教練就能排課</div><button class="btn lime" id="sendT">${at ? '更新送出' : '送出'}</button></div></div>
  </div>`;
  $('#addT').onclick = () => tennisEntrySheet(-1);
  document.querySelectorAll('[data-ed]').forEach(b => b.onclick = () => tennisEntrySheet(+b.dataset.ed));
  document.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { local.splice(+b.dataset.rm, 1); renderTennisCoach(); });
  $('#copyLast').onclick = async () => {
    try { const r = await api('getTennis', { date: E.addDays(st.date, -7) }); const last = r.tennis.filter(t => t.coach === me.name || t.coach === me.code);
      if (!last.length) return toast('上週' + E.weekday(st.date) + '沒有你的課');
      st.tdraft.entries = last.map(t => ({ start: t.start, end: t.end, players: t.players.map(d.resolve) })); renderTennisCoach(); toast('已帶入上週 ' + last.length + ' 堂，記得改有變動的再送出');
    } catch (e) { toast(e.message); }
  };
  $('#sendT').onclick = async () => {
    try { await api('saveTennis', { date: st.date, coach: me.code || me.name, entries: st.tdraft.entries, by: me.name }); st.tdraft = null; toast('已送出，謝謝！'); load(); }
    catch (e) { toast('送不出去：' + e.message); }
  };
}
function tennisEntrySheet(i) {
  const e = i >= 0 ? st.tdraft.entries[i] : { start: '15:00', end: '17:00', players: [] };
  const times = []; for (let m = 7 * 60; m <= 21 * 60; m += 30) times.push(E.fmt(m));
  const sel = new Set(e.players);
  sheet(`<h2>${i >= 0 ? '改' : '加'}一堂網球課</h2>
    <div class="row" style="margin-top:8px"><label class="sm">開始 <select id="tS">${times.map(t => `<option ${t === e.start ? 'selected' : ''}>${t}</option>`).join('')}</select></label><label class="sm">結束 <select id="tE">${times.map(t => `<option ${t === e.end ? 'selected' : ''}>${t}</option>`).join('')}</select></label></div>
    <p class="eyebrow" style="margin-top:14px">學生（點選，可複選）</p>
    <input type="text" id="tQ" placeholder="搜尋名字或暱稱；名單沒有的人直接打名字按 Enter" style="width:100%;margin-bottom:8px">
    <div class="pick" id="tP"></div>
    <div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn ghost" id="tNo">取消</button><button class="btn" id="tOk">好了</button></div>`, () => {
    const draw = () => { const q = $('#tQ').value.trim().toLowerCase(); const list = [...new Set([...sel, ...st.day.roster.filter(p => !q || E.nameKey(p.name + ' ' + p.alias).includes(E.nameKey(q))).map(p => p.name)])];
      $('#tP').innerHTML = list.map(n => `<button aria-pressed="${sel.has(n)}" data-n="${esc(n)}">${esc(n)}</button>`).join(''); document.querySelectorAll('#tP [data-n]').forEach(b => b.onclick = () => { sel.has(b.dataset.n) ? sel.delete(b.dataset.n) : sel.add(b.dataset.n); draw(); }); };
    draw(); $('#tQ').oninput = draw;
    $('#tQ').onkeydown = ev => { if (ev.key === 'Enter' && $('#tQ').value.trim()) { ev.preventDefault(); sel.add(st.day.resolve($('#tQ').value.trim())); $('#tQ').value = ''; draw(); } };
    $('#tNo').onclick = closeSheet;
    $('#tOk').onclick = () => {
      const s = $('#tS').value, en = $('#tE').value;
      if (E.toMin(en) <= E.toMin(s)) return toast('結束要比開始晚');
      if (!sel.size) return toast('至少選一位學生');
      const ne = { start: s, end: en, players: [...sel] };
      if (i >= 0) st.tdraft.entries[i] = ne; else st.tdraft.entries.push(ne);
      st.tdraft.entries.sort((a, b) => E.toMin(a.start) - E.toMin(b.start));
      closeSheet(); renderTennisCoach();
    };
  });
}

// ───────────── 啟動 ─────────────
window.addEventListener('beforeunload', e => { if (st.dirty) { e.preventDefault(); e.returnValue = ''; } });
(function boot() {
  if (IS_DEV || USE_TEST) $('#testTag').hidden = false;
  try { const m = JSON.parse(LS.get('yj_train_me') || 'null'); if (m && m.token) { st.me = m; return start(); } } catch (e) {}
  gate();
})();
</script>
</body>
</html>
